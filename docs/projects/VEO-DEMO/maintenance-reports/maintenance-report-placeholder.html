<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maintenance report (demo placeholder)</title>
<style>
:root { color-scheme: light dark; --bg: #ffffff; --fg: #1a1a1a; --note: #fff4d6; --edge: #c98a00; }
@media (prefers-color-scheme: dark) { :root { --bg: #16181c; --fg: #e8e8e8; --note: #3a2f12; --edge: #e0a82e; } }
body { margin: 0; padding: 32px 16px; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
main { max-width: 640px; margin: 0 auto; }
.note { padding: 16px; border: 2px solid var(--edge); border-radius: 6px; background: var(--note); }
</style>
</head>
<body>
<main>
<h1>Maintenance report</h1>
<p class="note"><strong>Demo placeholder.</strong> This file is not a real VEO document. It contains no data from a site.</p>
<p>Project: VEO-DEMO. Folder: maintenance-reports.</p>
<p>The demo uses a local folder structure. In production, VEO keeps the real documents in SharePoint.</p>
</main>
</body>
</html>
